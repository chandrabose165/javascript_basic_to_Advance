<!DOCTYPE html>
<html>
<head>
    <title>javascript</title>
</head>
<body>
    <script>
        // there are four main datatype used in javascript and there are total 7 primitive datatype.
        let num = 20;
        let name = "chandrabose";// the group of some character is called String.
        const ID = "AF05237671";
        let  Attendance = 88.5;
        console.log(typeof(num) ,num);
        console.log(typeof(name) ,name);
        console.log(typeof(ID) ,ID);
        console.log(typeof(Attendance) ,Attendance);
        // There are one non-primitive datatype and it is also called as object type
        const Studentinfo = { 
            // Studentinfo is an object through that we can elements
            firstname : "chandrabose",
            lastname : "varisa",
            course : "MERN_AI"
        }
        console.log(Studentinfo);
        // to check the type we have some built-in function called typeof for this function we can check each and every datatype
    </script>
</body>
</html>
