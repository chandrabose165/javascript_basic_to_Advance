<!DOCTYPE html>
<html lang="en">
<head>
    <title>Loop statements</title>
</head>
<body>
    <script>
        // for Loop
        let x = 5;
        for(let j = 0;j<x;j++){
            console.log(j);
        }
        // while Loop
        let num = 1;
        while(num  <=5){
            console.log(num);
            num++;
        }
    </script>
    
</body>
</html>
